<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "TARAflow" }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  {% include topbar.html %}

  {% if page.section == 'app' %}
    {% include sidebar-app.html %}
  {% elsif page.section == 'dev' %}
    {% include sidebar-dev.html %}
  {% endif %}

  <main class="content{% if page.section %} with-sidebar{% endif %}">
    <div class="content-inner">
      {{ content }}
      {% include footer.html %}
    </div>
  </main>
</body>
</html>
